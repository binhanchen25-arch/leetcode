name: Auto Commit Time

on:
  schedule:
    # 这里的 Cron 表达式使用的是 UTC 时间（格林威治标准时间）
    # 北京时间（UTC+8）的 11:00, 13:00, 15:00，对应 UTC 时间的 03:00, 05:00, 07:00
    # "*/1" 表示每隔1天执行
    - cron: '0 3,5,7 */1 * *'
  workflow_dispatch: # 允许你在 GitHub 页面上手动点击运行，方便测试

jobs:
  update-readme:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Update README with current time
      run: |
        # 获取北京时间并追加到 README.md
        echo "Auto commit at: $(TZ='Asia/Shanghai' date '+%Y-%m-%d %H:%M:%S')" >> README.md

    - name: Commit and Push changes
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
        
        git add README.md
        # 只有在有文件变动时才 commit，防止没有变动时报错
        git diff-index --quiet HEAD || (git commit -m "chore: auto update README time [skip ci]" && git push)
